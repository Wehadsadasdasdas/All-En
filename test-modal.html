<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal Test</title>
    <link rel="stylesheet" href="admin-style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@48,400,0,0"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        padding: 2rem;
        background: #f5f5f5;
      }

      .test-button {
        background: linear-gradient(135deg, #7380ec 0%, #8b94f0 100%);
        color: white;
        border: none;
        padding: 1rem 2rem;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        margin: 1rem;
      }

      /* Include the modal styles from admin-product.php */
      .modal-product {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(4px);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 1rem;
        box-sizing: border-box;
      }

      .modal-content-product {
        background: white;
        padding: 0;
        border-radius: 12px;
        width: 90%;
        max-width: 600px;
        max-height: 85vh;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
      }

      .modal-content-product h2 {
        background: linear-gradient(135deg, #7380ec 0%, #8b94f0 100%);
        color: white;
        margin: 0;
        padding: 1.2rem 2rem;
        font-size: 1.4rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.8rem;
        flex-shrink: 0;
      }

      .modal-body {
        padding: 1.5rem 2rem;
        overflow-y: auto;
        flex: 1;
        max-height: calc(85vh - 160px);
        scroll-behavior: smooth;
      }

      .modal-body::-webkit-scrollbar {
        width: 6px;
      }

      .modal-body::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 3px;
      }

      .modal-body::-webkit-scrollbar-thumb {
        background: #7380ec;
        border-radius: 3px;
      }

      .modal-actions-product {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
        padding: 1rem 2rem;
        background: #f8f9fa;
        border-top: 1px solid #e9ecef;
        flex-shrink: 0;
      }

      .modal-actions-product button {
        padding: 0.7rem 1.5rem;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .hidden-product {
        display: none;
      }

      form label {
        display: block;
        margin-bottom: 1rem;
        font-weight: 600;
        color: #333;
      }

      form input,
      form textarea,
      form select {
        width: 100%;
        padding: 0.6rem 0.8rem;
        margin-top: 0.3rem;
        border: 2px solid #e9ecef;
        border-radius: 6px;
        font-size: 0.85rem;
        box-sizing: border-box;
      }

      form textarea {
        min-height: 80px;
        resize: vertical;
      }
    </style>
  </head>
  <body>
    <h1>Add Product Modal Test</h1>
    <p>Click the button below to test the modal sizing and fit:</p>

    <button class="test-button" onclick="openModal()">
      Open Add Product Modal
    </button>

    <!-- Add Product Modal -->
    <div id="productModal" class="modal-product hidden-product">
      <div class="modal-content-product">
        <h2>🛍️ Add Product</h2>
        <div class="modal-body">
          <form id="productForm">
            <label>
              Category:
              <select required>
                <option value="">--Select Category--</option>
                <option value="1">Luggage</option>
                <option value="2">Luggage Accessories</option>
                <option value="3">Travel Accessories</option>
              </select>
            </label>

            <label>
              Product ID:
              <input type="text" required placeholder="Enter product ID" />
            </label>

            <label>
              Product Name:
              <input type="text" required placeholder="Enter product name" />
            </label>

            <label>
              Product Image:
              <input type="file" accept=".jpg, .jpeg, .png, .gif" />
            </label>

            <label>
              Description:
              <textarea placeholder="Enter product description"></textarea>
            </label>

            <div
              style="
                background: #f8f9fa;
                border-radius: 8px;
                padding: 1rem;
                margin: 1rem 0;
              "
            >
              <h3 style="margin-bottom: 1rem; color: #7380ec">
                📏 Sizes & Colors
              </h3>

              <div
                style="
                  background: white;
                  border: 2px solid #e9ecef;
                  padding: 1rem;
                  margin-bottom: 1rem;
                  border-radius: 8px;
                "
              >
                <h4 style="margin-bottom: 0.8rem">Size Configuration</h4>
                <label>
                  Size:
                  <select required>
                    <option value="">--Select Size--</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                  </select>
                </label>

                <h4 style="margin: 1rem 0 0.8rem 0">Colors</h4>
                <div
                  style="
                    border: 1px solid #e9ecef;
                    padding: 0.8rem;
                    border-radius: 6px;
                    margin-bottom: 0.8rem;
                  "
                >
                  <label
                    >Color: <input type="text" placeholder="e.g., Red"
                  /></label>
                  <label
                    >Capital: <input type="number" placeholder="0.00"
                  /></label>
                  <label
                    >Price: <input type="number" placeholder="0.00"
                  /></label>
                  <label>Stock: <input type="number" placeholder="0" /></label>
                  <label
                    >Warranty Token: <input type="text" placeholder="Optional"
                  /></label>
                </div>

                <div
                  style="
                    border: 1px solid #e9ecef;
                    padding: 0.8rem;
                    border-radius: 6px;
                    margin-bottom: 0.8rem;
                  "
                >
                  <label
                    >Color: <input type="text" placeholder="e.g., Blue"
                  /></label>
                  <label
                    >Capital: <input type="number" placeholder="0.00"
                  /></label>
                  <label
                    >Price: <input type="number" placeholder="0.00"
                  /></label>
                  <label>Stock: <input type="number" placeholder="0" /></label>
                  <label
                    >Warranty Token: <input type="text" placeholder="Optional"
                  /></label>
                </div>
              </div>
            </div>
          </form>
        </div>

        <div class="modal-actions-product">
          <button
            type="button"
            onclick="closeModal()"
            style="background: #f8f9fa; color: #666; border: 2px solid #e9ecef"
          >
            Cancel
          </button>
          <button
            type="submit"
            style="
              background: linear-gradient(135deg, #7380ec 0%, #8b94f0 100%);
              color: white;
            "
          >
            Submit
          </button>
        </div>
      </div>
    </div>

    <script>
      function openModal() {
        document
          .getElementById("productModal")
          .classList.remove("hidden-product");
      }

      function closeModal() {
        document.getElementById("productModal").classList.add("hidden-product");
      }

      // Close modal when clicking outside
      document
        .getElementById("productModal")
        .addEventListener("click", function (e) {
          if (e.target === this) {
            closeModal();
          }
        });
    </script>
  </body>
</html>
